<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HASH RANKINGS</title>
<style>
:root {
  --bg: #10110f;
  --panel: #191b18;
  --panel2: #20231e;
  --lime: #c5ff45;
  --text: #f4f5ef;
  --muted: #92968c;
  --border: #30332c;
  --red: #ff6868;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, Arial, sans-serif;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
header {
  border-bottom: 1px solid var(--border);
  padding: 22px 6%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.logo { font-size: 21px; font-weight: 900; letter-spacing: 1.5px; }
.logo span { color: var(--lime); }
.status { color: var(--muted); font-size: 12px; }
main { max-width: 1000px; padding: 40px 20px 70px; margin: auto; }
.eyebrow {
  color: var(--lime);
  text-transform: uppercase;
  letter-spacing: 3px;
  font-size: 11px;
  font-weight: 800;
}
h1 { font-size: clamp(34px, 7vw, 62px); line-height: 1; margin: 12px 0; letter-spacing: -2px; }
.subtitle { color: var(--muted); margin-bottom: 30px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 28px; }
.stat { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
.stat strong { display: block; font-size: 28px; color: var(--lime); }
.stat small { color: var(--muted); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
input, textarea, select {
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 12px;
  min-width: 0;
  outline: none;
}
input:focus, textarea:focus, select:focus { border-color: var(--lime); }
#search { flex: 1; min-width: 160px; }
.btn {
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 11px 15px;
  background: var(--panel2);
  color: var(--text);
  font-weight: 750;
}
.btn:hover { border-color: var(--lime); }
.btn.primary { background: var(--lime); color: #14160f; border-color: var(--lime); }
.btn.danger { color: var(--red); }
.board { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.board-head {
  background: var(--panel);
  color: var(--muted);
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 1.4px;
  padding: 14px 18px;
  display: grid;
  grid-template-columns: 48px 1fr 85px 90px;
  gap: 12px;
}
.member {
  display: grid;
  grid-template-columns: 48px 1fr 85px 90px;
  gap: 12px;
  align-items: center;
  padding: 14px 18px;
  border-top: 1px solid var(--border);
}
.member:hover { background: #171914; }
.rank { color: var(--muted); font-weight: 800; }
.rank.top { color: var(--lime); }
.person { display: flex; align-items: center; gap: 12px; min-width: 0; }
.avatar {
  width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px;
  background: #292d23; color: var(--lime); display: grid;
  place-items: center; font-size: 17px; font-weight: 900; overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.person-name { font-weight: 800; overflow-wrap: anywhere; }
.person-note { color: var(--muted); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
.score { color: var(--lime); font-weight: 900; font-size: 18px; }
.actions { display: flex; gap: 6px; justify-content: flex-end; }
.icon-btn {
  background: transparent; color: var(--muted); border: 1px solid var(--border);
  border-radius: 7px; width: 34px; height: 34px;
}
.icon-btn:hover { color: var(--lime); border-color: var(--lime); }
.empty { text-align: center; padding: 45px 15px; color: var(--muted); }
footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 22px; line-height: 1.6; }
dialog {
  width: min(440px, calc(100% - 28px)); background: var(--panel);
  color: var(--text); border: 1px solid var(--border); border-radius: 16px;
  padding: 22px; max-height: 90vh; overflow-y: auto;
}
dialog::backdrop { background: #000b; }
dialog h2 { margin: 0 0 18px; }
.form-field { display: grid; gap: 7px; margin-bottom: 15px; }
.form-field label { color: var(--muted); font-size: 12px; font-weight: 700; }
.form-field input, .form-field textarea { width: 100%; }
.form-field textarea { resize: vertical; min-height: 72px; }
.form-buttons { display: flex; gap: 9px; justify-content: flex-end; margin-top: 20px; }
.photo-preview { width: 68px; height: 68px; border-radius: 12px; object-fit: cover; background: var(--panel2); }
@media (max-width: 520px) {
  main { padding: 30px 12px 50px; }
  header { padding: 18px 14px; }
  .status { display: none; }
  .board-head, .member { grid-template-columns: 27px minmax(0,1fr) 55px 66px; gap: 7px; padding: 12px 9px; }
  .avatar { width: 38px; height: 38px; border-radius: 10px; }
  .person { gap: 8px; }
  .actions { gap: 3px; }
  .icon-btn { width: 29px; height: 31px; }
  .score { font-size: 16px; }
}
</style>
</head>
<body>
<header>
  <div class="logo">HASH <span>RANKINGS</span></div>
  <div class="status">COMMUNITY LEADERBOARD</div>
</header>

<main>
  <div class="eyebrow">The leaderboard</div>
  <h1>WHO'S ON TOP<span style="color:var(--lime)">?</span></h1>
  <div class="subtitle">Track points, achievements, and bragging rights.</div>

  <section class="stats">
    <div class="stat"><strong id="memberCount">0</strong><small>MEMBERS</small></div>
    <div class="stat"><strong id="topScore">—</strong><small>HIGHEST SCORE</small></div>
  </section>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Search members..." aria-label="Search members">
    <select id="sort" aria-label="Sort members">
      <option value="score">Highest points</option>
      <option value="low">Lowest points</option>
      <option value="name">Name A–Z</option>
      <option value="new">Recently added</option>
    </select>
    <button class="btn primary" id="addBtn">+ Add member</button>
  </div>

  <section class="board">
    <div class="board-head">
      <div>Rank</div><div>Member</div><div>Points</div><div style="text-align:right">Edit</div>
    </div>
    <div id="leaderboard"></div>
  </section>

  <footer>
    Your changes are saved in this browser on this device.<br>
    This first version does not sync changes to other people's devices.
  </footer>
</main>

<dialog id="memberDialog">
  <form id="memberForm">
    <h2 id="dialogTitle">Add member</h2>
    <input type="hidden" id="memberId">

    <div class="form-field">
      <label for="memberName">Name or nickname *</label>
      <input id="memberName" maxlength="40" required placeholder="e.g. PlayerOne">
    </div>

    <div class="form-field">
      <label for="memberScore">Points (0–100) *</label>
      <input id="memberScore" type="number" min="0" max="100" step="1" required value="50">
    </div>

    <div class="form-field">
      <label for="memberNote">Achievement or note</label>
      <textarea id="memberNote" maxlength="160" placeholder="e.g. Won the last tournament"></textarea>
    </div>

    <div class="form-field">
      <label for="memberPhoto">Photo (optional; get permission first)</label>
      <input id="memberPhoto" type="file" accept="image/*">
      <img id="photoPreview" class="photo-preview" alt="Photo preview" hidden>
      <button class="btn" id="removePhoto" type="button" hidden>Remove photo</button>
    </div>

    <div class="form-buttons">
      <button class="btn" type="button" id="cancelBtn">Cancel</button>
      <button class="btn primary" type="submit">Save member</button>
    </div>
  </form>
</dialog>

<script>
const STORAGE_KEY = "hash-rankings-v1";

const starterMembers = [
  { id: "demo-1", name: "Angel", score: 95, note: "Add an achievement", photo: "", created: 1 },
  { id: "demo-2", name: "whostwizzy", score: 91, note: "Add an achievement", photo: "", created: 2 },
  { id: "demo-3", name: "Waltuh", score: 89, note: "Add an achievement", photo: "", created: 3 },
  { id: "demo-4", name: "yoni", score: 88, note: "Add an achievement", photo: "", created: 4 }
];

let members = loadMembers();
let photoData = "";

function loadMembers() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved === null ? starterMembers.map(m => ({...m})) : JSON.parse(saved);
  } catch {
    return starterMembers.map(m => ({...m}));
  }
}

function saveMembers() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(members));
    return true;
  } catch {
    alert("The browser storage is full. Try using smaller photos.");
    return false;
  }
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[char]);
}

function render() {
  const query = document.getElementById("search").value.trim().toLowerCase();
  const sort = document.getElementById("sort").value;
  let visible = members.filter(m =>
    m.name.toLowerCase().includes(query) ||
    (m.note || "").toLowerCase().includes(query)
  );

  if (sort === "score") visible.sort((a,b) => b.score - a.score || a.name.localeCompare(b.name));
  if (sort === "low") visible.sort((a,b) => a.score - b.score || a.name.localeCompare(b.name));
  if (sort === "name") visible.sort((a,b) => a.name.localeCompare(b.name));
  if (sort === "new") visible.sort((a,b) => b.created - a.created);

  document.getElementById("memberCount").textContent = members.length;
  document.getElementById("topScore").textContent =
    members.length ? Math.max(...members.map(m => Number(m.score))) : "—";

  const board = document.getElementById("leaderboard");
  if (!visible.length) {
    board.innerHTML = '<div class="empty">No members found. Try another search or add someone.</div>';
    return;
  }

  board.innerHTML = visible.map((m, i) => {
    const rank = sort === "score" ? i + 1 : members
      .slice().sort((a,b) => b.score - a.score)
      .findIndex(x => x.id === m.id) + 1;
    const avatar = m.photo
      ? `<img src="${m.photo}" alt="">`
      : escapeHTML((m.name.trim()[0] || "?").toUpperCase());
    return `
      <div class="member">
        <div class="rank ${rank <= 3 ? "top" : ""}">#${rank}</div>
        <div class="person">
          <div class="avatar">${avatar}</div>
          <div style="min-width:0">
            <div class="person-name">${escapeHTML(m.name)}</div>
            <div class="person-note">${escapeHTML(m.note || "No note added")}</div>
          </div>
        </div>
        <div class="score">${Number(m.score)}</div>
        <div class="actions">
          <button class="icon-btn" data-edit="${m.id}" aria-label="Edit ${escapeHTML(m.name)}" title="Edit">✎</button>
          <button class="icon-btn" data-delete="${m.id}" aria-label="Delete ${escapeHTML(m.name)}" title="Delete">×</button>
        </div>
      </div>`;
  }).join("");
}

const dialog = document.getElementById("memberDialog");
const form = document.getElementById("memberForm");
const photoInput = document.getElementById("memberPhoto");
const preview = document.getElementById("photoPreview");
const removePhotoBtn = document.getElementById("removePhoto");

function showPreview(src) {
  photoData = src || "";
  preview.hidden = !photoData;
  preview.src = photoData || "";
  removePhotoBtn.hidden = !photoData;
}

function openAdd() {
  form.reset();
  document.getElementById("memberId").value = "";
  document.getElementById("dialogTitle").textContent = "Add member";
  document.getElementById("memberScore").value = 50;
  showPreview("");
  dialog.showModal();
}

function openEdit(id) {
  const m = members.find(x => x.id === id);
  if (!m) return;
  form.reset();
  document.getElementById("memberId").value = m.id;
  document.getElementById("dialogTitle").textContent = "Edit member";
  document.getElementById("memberName").value = m.name;
  document.getElementById("memberScore").value = m.score;
  document.getElementById("memberNote").value = m.note || "";
  showPreview(m.photo || "");
  dialog.showModal();
}

document.getElementById("addBtn").addEventListener("click", openAdd);
document.getElementById("cancelBtn").addEventListener("click", () => dialog.close());
document.getElementById("search").addEventListener("input", render);
document.getElementById("sort").addEventListener("change", render);

document.getElementById("leaderboard").addEventListener("click", event => {
  const editButton = event.target.closest("[data-edit]");
  const deleteButton = event.target.closest("[data-delete]");
  if (editButton) openEdit(editButton.dataset.edit);
  if (deleteButton) {
    const m = members.find(x => x.id === deleteButton.dataset.delete);
    if (m && confirm(`Delete ${m.name} from the leaderboard?`)) {
      members = members.filter(x => x.id !== m.id);
      if (saveMembers()) render();
    }
  }
});

photoInput.addEventListener("change", () => {
  const file = photoInput.files && photoInput.files[0];
  if (!file) return;
  if (!file.type.startsWith("image/")) {
    alert("Please choose an image file.");
    photoInput.value = "";
    return;
  }
  if (file.size > 1.5 * 1024 * 1024) {
    alert("Please choose a photo smaller than 1.5 MB.");
    photoInput.value = "";
    return;
  }
  const reader = new FileReader();
  reader.onload = () => showPreview(reader.result);
  reader.readAsDataURL(file);
});

removePhotoBtn.addEventListener("click", () => {
  showPreview("");
  photoInput.value = "";
});

form.addEventListener("submit", event => {
  event.preventDefault();
  const name = document.getElementById("memberName").value.trim();
  const score = Number(document.getElementById("memberScore").value);
  const note = document.getElementById("memberNote").value.trim();
  const id = document.getElementById("memberId").value;

  if (!name || !Number.isFinite(score) || score < 0 || score > 100) {
    alert("Enter a name and a score from 0 to 100.");
    return;
  }

  const existing = members.find(m => m.id === id);
  const member = {
    id: existing ? existing.id : (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
    name,
    score,
    note,
    photo: photoData,
    created: existing ? existing.created : Date.now()
  };

  if (existing) {
    members = members.map(m => m.id === id ? member : m);
  } else {
    members.push(member);
  }

  if (saveMembers()) {
    dialog.close();
    render();
  }
});

render();
</script>
</body>
</html>
